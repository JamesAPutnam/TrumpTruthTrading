name: Poll Truth Social

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to push the updated last_post_id.txt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'        # caches ~/.cache/pip — skips reinstall on unchanged requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poll
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: 'true'
        run: python main.py --once

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_post_id.txt data/trump_id.txt data/posts_log.csv data/trades.csv
          git diff --staged --quiet || git commit -m "chore: state update [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push
